<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="950" height="620" style="background: #030712; border-radius: 20px; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background Glows -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    
    <!-- Node Gradient Fills -->
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    
    <!-- Accent Color Gradients -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>

  <style>
    /* CSS Micro-Animations */
    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }
    .flow-path {
      stroke-dasharray: 6, 8;
      animation: dash 2.5s linear infinite;
    }
    .flow-path-reverse {
      stroke-dasharray: 6, 8;
      animation: dash 2.5s linear infinite reverse;
    }
    
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }
    .pulse-glow {
      animation: pulse 3s ease-in-out infinite;
    }
    
    @keyframes blink {
      0%, 100% { fill: #ef4444; }
      50% { fill: #22c55e; }
    }
    .live-dot {
      animation: blink 2s infinite;
    }
    
    /* Hover effects for SVG Interactive Viewer */
    .card-node {
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    .card-node:hover {
      transform: translate(-3px, -3px);
    }
  </style>

  <!-- Base Background & Ambient Glow -->
  <rect width="950" height="620" fill="#020617" />
  <circle cx="475" cy="310" r="400" fill="url(#bg-glow)" />

  <!-- Grid overlay -->
  <path d="M0 50 H950 M0 100 H950 M0 150 H950 M0 200 H950 M0 250 H950 M0 300 H950 M0 350 H950 M0 400 H950 M0 450 H950 M0 500 H950 M0 550 H950 M50 0 V620 M100 0 V620 M150 0 V620 M200 0 V620 M250 0 V620 M300 0 V620 M350 0 V620 M400 0 V620 M450 0 V620 M500 0 V620 M550 0 V620 M600 0 V620 M650 0 V620 M700 0 V620 M750 0 V620 M800 0 V620 M850 0 V620 M900 0 V620" 
        stroke="rgba(255,255,255,0.015)" stroke-width="1" />
  <rect x="10" y="10" width="930" height="600" rx="15" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2" />

  <!-- HEADER (CENTER ALIGNED) -->
  <text x="475" y="45" font-size="22" font-weight="900" fill="url(#amber-grad)" letter-spacing="1.5" text-anchor="middle">PAWVAIDYA SYSTEM TOPOLOGY &amp; ARCHITECTURE</text>
  <text x="475" y="65" font-size="12" fill="#64748b" font-weight="500" text-anchor="middle">MERN Stack Veterinary Intelligence Platform • High-Fidelity Data &amp; Live WebSocket Flow Map</text>

  <!-- ==================== FLOW LINES ==================== -->
  <!-- User to Gateway -->
  <path d="M 285 160 C 325 160, 320 250, 360 250" fill="none" stroke="#3b82f6" stroke-width="2" class="flow-path" />
  <!-- CS to Gateway -->
  <path d="M 285 320 C 325 320, 320 300, 360 300" fill="none" stroke="#10b981" stroke-width="2" class="flow-path" />
  <!-- Admin to Gateway -->
  <path d="M 285 480 C 325 480, 320 350, 360 350" fill="none" stroke="#f59e0b" stroke-width="2" class="flow-path" />

  <!-- Gateway to Services -->
  <path d="M 590 250 C 625 250, 630 190, 665 190" fill="none" stroke="#8b5cf6" stroke-width="2" class="flow-path" />
  <!-- Gateway to DB -->
  <path d="M 590 350 C 625 350, 630 410, 665 410" fill="none" stroke="#10b981" stroke-width="2" class="flow-path" />

  <!-- Bi-directional Live Chat Socket Loop -->
  <path d="M 285 140 Q 475 125, 665 140" fill="none" stroke="#8b5cf6" stroke-dasharray="4,6" stroke-width="1.5" class="flow-path-reverse" opacity="0.6" />
  <text x="475" y="112" fill="#a855f7" font-size="9" font-weight="700" text-anchor="middle">Live Socket Messages &amp; Typing Indicator Relay</text>

  <!-- ==================== LEFT COLUMN: FRONTEND PORTALS (WIDTH: 250) ==================== -->
  
  <!-- USER PORTAL CARD -->
  <g class="card-node" transform="translate(35, 90)">
    <rect width="250" height="140" rx="10" fill="url(#node-grad)" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="250" height="28" rx="10" fill="url(#blue-grad)" opacity="0.1" />
    <circle cx="20" cy="14" r="5" fill="#3b82f6" />
    <text x="35" y="19" fill="#f8fafc" font-size="12" font-weight="800">User Portal (React/Vite)</text>
    
    <text x="15" y="48" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• Gold Plan: </tspan>
      <tspan fill="#94a3b8">RF Disease Predictor &amp; PDFs</tspan>
    </text>
    <text x="15" y="66" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• Platinum: </tspan>
      <tspan fill="#94a3b8">Vitals check &amp; AI advisory letters</tspan>
    </text>
    <text x="15" y="84" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• Live Chat: </tspan>
      <tspan fill="#94a3b8">Media lightboxes &amp; file uploads</tspan>
    </text>
    <text x="15" y="102" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• ZegoCloud: </tspan>
      <tspan fill="#94a3b8">WebRTC video consultations</tspan>
    </text>
    <text x="15" y="120" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• Pet Profiles: </tspan>
      <tspan fill="#94a3b8">Official ID Document Gen</tspan>
    </text>
  </g>

  <!-- CUSTOMER SERVICE 360 CARD -->
  <g class="card-node" transform="translate(35, 250)">
    <rect width="250" height="140" rx="10" fill="url(#node-grad)" stroke="#10b981" stroke-width="1.5" />
    <rect width="250" height="28" rx="10" fill="url(#emerald-grad)" opacity="0.1" />
    <circle cx="20" cy="14" r="5" fill="#10b981" />
    <text x="35" y="19" fill="#f8fafc" font-size="12" font-weight="800">CS 360 Portal (React/Vite)</text>
    
    <text x="15" y="48" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• Screen Record: </tspan>
      <tspan fill="#94a3b8">Forced Firebase captures</tspan>
    </text>
    <text x="15" y="66" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• Biometrics: </tspan>
      <tspan fill="#94a3b8">Webcam Face-API.js alarm</tspan>
    </text>
    <text x="15" y="84" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• Customer 360: </tspan>
      <tspan fill="#94a3b8">Gold/Platinum logs view</tspan>
    </text>
    <text x="15" y="102" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• DigiLocker: </tspan>
      <tspan fill="#94a3b8">Aadhaar agent verification</tspan>
    </text>
    <text x="15" y="120" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• QA Bypasses: </tspan>
      <tspan fill="#94a3b8">Quick developer logins</tspan>
    </text>
  </g>

  <!-- ADMIN & DOCTOR PORTAL CARD -->
  <g class="card-node" transform="translate(35, 410)">
    <rect width="250" height="140" rx="10" fill="url(#node-grad)" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="250" height="28" rx="10" fill="url(#amber-grad)" opacity="0.1" />
    <circle cx="20" cy="14" r="5" fill="#f59e0b" />
    <text x="35" y="19" fill="#f8fafc" font-size="12" font-weight="800">Admin Command Center</text>
    
    <text x="15" y="48" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• Vet Schedules: </tspan>
      <tspan fill="#94a3b8">Duration slots &amp; toggles</tspan>
    </text>
    <text x="15" y="66" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• Vet Blogs: </tspan>
      <tspan fill="#94a3b8">Verification badges &amp; media</tspan>
    </text>
    <text x="15" y="84" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• Ban System: </tspan>
      <tspan fill="#94a3b8">Auto-logout &amp; slot cancel</tspan>
    </text>
    <text x="15" y="102" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• Observability: </tspan>
      <tspan fill="#94a3b8">Render logs &amp; metrics</tspan>
    </text>
    <text x="15" y="120" font-size="10">
      <tspan fill="#e2e8f0" font-weight="700">• Telemetry: </tspan>
      <tspan fill="#94a3b8">CPU, RAM &amp; thermal gauges</tspan>
    </text>
  </g>


  <!-- ==================== MIDDLE COLUMN: CORE NODE.JS BACKEND ==================== -->
  
  <!-- NODE CORE GATEWAY ENGINE CARD -->
  <g transform="translate(360, 200)">
    <rect width="230" height="200" rx="12" fill="url(#node-grad)" stroke="#f43f5e" stroke-width="2" />
    <rect width="230" height="32" rx="12" fill="url(#rose-grad)" opacity="0.1" />
    <circle cx="20" cy="16" r="5" fill="#f43f5e" class="live-dot" />
    <text x="35" y="21" fill="#f8fafc" font-size="13" font-weight="900" letter-spacing="0.5">Core Backend (Node.js)</text>
    
    <!-- Security Shield -->
    <g transform="translate(15, 45)">
      <rect width="200" height="35" rx="6" fill="#1e293b" stroke="#e11d48" stroke-width="1" />
      <text x="10" y="21" fill="#f8fafc" font-size="10" font-weight="700">Security: SQLi &amp; XSS Middleware</text>
    </g>

    <!-- API Routes / Express -->
    <g transform="translate(15, 90)">
      <rect width="200" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="10" y="17" fill="#fda4af" font-size="10" font-weight="800">REST API Gateway (Express)</text>
      <text x="10" y="32" fill="#94a3b8" font-size="9">JWT Auth • IP Whitelists • Geo-Approval</text>
    </g>

    <!-- Socket.IO Engine -->
    <g transform="translate(15, 142)">
      <rect width="200" height="45" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="10" y="18" fill="#c7d2fe" font-size="10" font-weight="800">Socket.IO Real-Time server</text>
      <text x="10" y="32" fill="#94a3b8" font-size="9">Channels: Chat, Typing &amp; Ban Ejections</text>
    </g>
  </g>


  <!-- ==================== RIGHT COLUMN: SERVICES & DATABASE (WIDTH: 250) ==================== -->
  
  <!-- CLOUD & AI INTEGRATIONS -->
  <g class="card-node" transform="translate(665, 90)">
    <rect width="250" height="200" rx="10" fill="url(#node-grad)" stroke="#8b5cf6" stroke-width="1.5" />
    <rect width="250" height="28" rx="10" fill="url(#purple-grad)" opacity="0.1" />
    <circle cx="20" cy="14" r="5" fill="#8b5cf6" />
    <text x="35" y="19" fill="#f8fafc" font-size="12" font-weight="800">Integrated Services</text>
    
    <text x="15" y="48" font-size="10">
      <tspan fill="#c084fc" font-weight="700">🤖 Google Gemini: </tspan>
      <tspan fill="#94a3b8">AI symptom chatbot</tspan>
    </text>
    <text x="15" y="68" font-size="10">
      <tspan fill="#60a5fa" font-weight="700">📹 ZegoCloud: </tspan>
      <tspan fill="#94a3b8">WebRTC consultations</tspan>
    </text>
    <text x="15" y="88" font-size="10">
      <tspan fill="#34d399" font-weight="700">☁️ Cloudinary: </tspan>
      <tspan fill="#94a3b8">Chat &amp; Blog media storage</tspan>
    </text>
    <text x="15" y="108" font-size="10">
      <tspan fill="#f87171" font-weight="700">🔥 Firebase: </tspan>
      <tspan fill="#94a3b8">CS shift screen recordings</tspan>
    </text>
    <text x="15" y="128" font-size="10">
      <tspan fill="#fbbf24" font-weight="700">💳 Razorpay: </tspan>
      <tspan fill="#94a3b8">Vet billing &amp; wallets</tspan>
    </text>
    <text x="15" y="148" font-size="10">
      <tspan fill="#38bdf8" font-weight="700">🪵 Supabase: </tspan>
      <tspan fill="#94a3b8">Security threat audits</tspan>
    </text>
    <text x="15" y="168" font-size="10">
      <tspan fill="#fb7185" font-weight="700">📈 Render API: </tspan>
      <tspan fill="#94a3b8">Server metrics &amp; bandwidth</tspan>
    </text>
  </g>

  <!-- MONGODB ATLAS DB CLUSTER -->
  <g class="card-node" transform="translate(665, 310)">
    <rect width="250" height="240" rx="10" fill="url(#node-grad)" stroke="#22c55e" stroke-width="1.5" />
    <rect width="250" height="28" rx="10" fill="url(#emerald-grad)" opacity="0.1" />
    <circle cx="20" cy="14" r="5" fill="#22c55e" />
    <text x="35" y="19" fill="#f8fafc" font-size="12" font-weight="800">MongoDB Atlas Database</text>
    
    <!-- 3D Database Cylinder Drawings (Horizontally Aligned) -->
    <g transform="translate(20, 45)" fill="none" stroke="#22c55e" stroke-width="1.2">
      <!-- Database 1 -->
      <ellipse cx="25" cy="10" rx="18" ry="4" fill="#0f172a" />
      <path d="M 7 10 L 7 35 A 18 4 0 0 0 43 35 L 43 10" fill="#0f172a" />
      <ellipse cx="25" cy="20" rx="18" ry="4" />
      <ellipse cx="25" cy="30" rx="18" ry="4" />
      
      <!-- Database 2 (Replica, y-aligned) -->
      <g transform="translate(45, 0)">
        <ellipse cx="25" cy="10" rx="18" ry="4" fill="#0f172a" opacity="0.6" />
        <path d="M 7 10 L 7 35 A 18 4 0 0 0 43 35 L 43 10" fill="#0f172a" opacity="0.6" />
        <ellipse cx="25" cy="20" rx="18" ry="4" />
        <ellipse cx="25" cy="30" rx="18" ry="4" />
      </g>
      
      <text x="110" y="24" fill="#f8fafc" font-size="11" font-weight="800" stroke="none">Data Schema Models</text>
    </g>

    <!-- Schema details list inside DB Card (Description texts fit inside width 250) -->
    <text x="20" y="112" fill="#34d399" font-size="10" font-weight="700">💾 Collections &amp; Key Properties:</text>
    
    <text x="20" y="130" font-size="9">
      <tspan fill="#e2e8f0" font-weight="700">• Users: </tspan>
      <tspan fill="#94a3b8">Credentials, isBanned, Reason</tspan>
    </text>
    <text x="20" y="147" font-size="9">
      <tspan fill="#e2e8f0" font-weight="700">• Doctors: </tspan>
      <tspan fill="#94a3b8">Speciality, Slots, isBanned</tspan>
    </text>
    <text x="20" y="164" font-size="9">
      <tspan fill="#e2e8f0" font-weight="700">• Schedules: </tspan>
      <tspan fill="#94a3b8">Availability &amp; Status Toggles</tspan>
    </text>
    <text x="20" y="181" font-size="9">
      <tspan fill="#e2e8f0" font-weight="700">• ChatMessage: </tspan>
      <tspan fill="#94a3b8">Sender, Message Type, Media</tspan>
    </text>
    <text x="20" y="198" font-size="9">
      <tspan fill="#e2e8f0" font-weight="700">• Appointments: </tspan>
      <tspan fill="#94a3b8">Slots, petId, Cancel Reasons</tspan>
    </text>
    <text x="20" y="215" font-size="9">
      <tspan fill="#e2e8f0" font-weight="700">• Reports: </tspan>
      <tspan fill="#94a3b8">Status, Action, Evidence</tspan>
    </text>
  </g>


  <!-- ==================== FLOW RESPONDERS GLOW SPHERES ==================== -->
  <circle cx="360" cy="250" r="3" fill="#3b82f6" class="pulse-glow" filter="url(#glow)" />
  <circle cx="360" cy="300" r="3" fill="#10b981" class="pulse-glow" filter="url(#glow)" />
  <circle cx="360" cy="350" r="3" fill="#f59e0b" class="pulse-glow" filter="url(#glow)" />
  <circle cx="665" cy="190" r="3" fill="#8b5cf6" class="pulse-glow" filter="url(#glow)" />
  <circle cx="665" cy="410" r="3" fill="#22c55e" class="pulse-glow" filter="url(#glow)" />
</svg>
