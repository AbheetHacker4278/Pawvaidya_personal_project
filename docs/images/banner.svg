<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%" style="background: #030712; border-radius: 20px; overflow: hidden; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background Glow Gradients -->
    <radialGradient id="glow-gold" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-blue" cx="20%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    
    <!-- Text Gradients -->
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Filter for neon glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 15px rgba(234, 179, 8, 0.6)); }
      100% { transform: scale(1); opacity: 0.8; }
    }
    @keyframes drift-fast {
      0% { transform: translate(0, 0); }
      50% { transform: translate(30px, -20px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes drift-slow {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-40px, 15px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes ecg-draw {
      0% { stroke-dashoffset: 1600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.15); }
      28% { transform: scale(1); }
      42% { transform: scale(1.15); }
      70% { transform: scale(1); }
    }
    @keyframes blink {
      0%, 100% { fill: #ef4444; }
      50% { fill: #22c55e; }
    }
    .bg-glow-1 { animation: drift-fast 12s ease-in-out infinite; }
    .bg-glow-2 { animation: drift-slow 18s ease-in-out infinite; }
    .floating-logo { animation: float 6s ease-in-out infinite; transform-origin: 140px 140px; }
    .pulse-paw { animation: heartbeat 2.5s infinite; transform-origin: 140px 115px; }
    .pulse-glow { animation: pulse 3s ease-in-out infinite; }
    .ecg-line {
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: ecg-draw 5s linear infinite;
    }
    .live-dot {
      animation: blink 2s infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="800" height="280" fill="#020617" />
  
  <!-- Glowing Background Orbs -->
  <circle class="bg-glow-1" cx="650" cy="80" r="180" fill="url(#glow-gold)" opacity="0.7" />
  <circle class="bg-glow-2" cx="150" cy="200" r="220" fill="url(#glow-blue)" opacity="0.7" />

  <!-- Grid Pattern Overlay -->
  <path d="M0 40 H800 M0 80 H800 M0 120 H800 M0 160 H800 M0 200 H800 M0 240 H800 M80 0 V280 M160 0 V280 M240 0 V280 M320 0 V280 M400 0 V280 M480 0 V280 M560 0 V280 M640 0 V280 M720 0 V280" 
        stroke="rgba(255,255,255,0.015)" stroke-width="1" />

  <!-- Decorative Border Lines -->
  <rect x="10" y="10" width="780" height="260" rx="12" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2" />
  <line x1="30" y1="20" x2="100" y2="20" stroke="#eab308" stroke-width="3" stroke-linecap="round" />
  <line x1="20" y1="30" x2="20" y2="80" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />

  <!-- ECG Heartbeat Flow Line (at the bottom) -->
  <path class="ecg-line" d="M 20 220 L 120 220 L 140 220 L 145 200 L 152 250 L 160 180 L 168 230 L 173 220 L 180 220 L 260 220 L 280 220 L 285 190 L 292 260 L 300 160 L 308 240 L 313 220 L 320 220 L 500 220 L 520 220 L 525 200 L 532 250 L 540 180 L 548 230 L 553 220 L 560 220 L 780 220" 
        fill="none" stroke="url(#line-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />

  <!-- Floating intelligence network nodes around paw -->
  <g stroke="#3b82f6" stroke-width="1.2" opacity="0.4">
    <line x1="85" y1="65" x2="118" y2="92" />
    <line x1="195" y1="65" x2="162" y2="92" />
    <line x1="60" y1="130" x2="103" y2="116" />
    <line x1="220" y1="130" x2="177" y2="116" />
  </g>
  <circle cx="85" cy="65" r="4.5" fill="#3b82f6" opacity="0.7" />
  <circle cx="85" cy="65" r="2" fill="#fff" />
  
  <circle cx="195" cy="65" r="4.5" fill="#eab308" opacity="0.7" />
  <circle cx="195" cy="65" r="2" fill="#fff" />

  <circle cx="60" cy="130" r="4.5" fill="#a855f7" opacity="0.7" />
  <circle cx="60" cy="130" r="2" fill="#fff" />

  <circle cx="220" cy="130" r="4.5" fill="#ef4444" opacity="0.7" />
  <circle cx="220" cy="130" r="2" fill="#fff" />

  <!-- Paw Print Icon (Floating and Pulsing) -->
  <g class="floating-logo">
    <!-- Outer Glow Ring -->
    <circle cx="140" cy="115" r="45" fill="none" stroke="rgba(234, 179, 8, 0.15)" stroke-width="2" class="pulse-glow" />
    <circle cx="140" cy="115" r="55" fill="none" stroke="rgba(59, 130, 246, 0.1)" stroke-width="1" class="pulse-glow" />
    
    <!-- Paw Shapes -->
    <g class="pulse-paw" fill="url(#grad-gold)">
      <!-- Top Left Toe -->
      <circle cx="118" cy="92" r="13" />
      <!-- Top Right Toe -->
      <circle cx="162" cy="92" r="13" />
      <!-- Outer Left Toe -->
      <circle cx="103" cy="116" r="11" />
      <!-- Outer Right Toe -->
      <circle cx="177" cy="116" r="11" />
      <!-- Main Pad -->
      <path d="M 140 108 C 122 108, 114 125, 120 137 C 124 145, 133 148, 140 148 C 147 148, 156 145, 160 137 C 166 125, 158 108, 140 108 Z" />
    </g>
  </g>
 
  <!-- Title & Subtitle Group -->
  <g transform="translate(230, 65)">
    <!-- Brand Title -->
    <text x="0" y="30" font-size="44" font-weight="900" letter-spacing="2" fill="url(#grad-gold)" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))">
      PawVaidya
    </text>
    
    <!-- Animated Checkmark/Verification Spark -->
    <g transform="translate(245, 3)" fill="#3b82f6" filter="url(#neon-glow)">
      <path d="M 9 -6 L 12 -3 L 20 -11 L 22 -9 L 12 1 L 7 -4 Z" transform="scale(1.8)" />
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="60" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="5" text-transform="uppercase">
      Veterinary Intelligence
    </text>

    <!-- Features Badges inside Header -->
    <g transform="translate(0, 80)">
      <!-- Row 1 -->
      <!-- AI Engine -->
      <rect x="0" y="0" width="95" height="24" rx="12" fill="rgba(147, 51, 234, 0.2)" stroke="rgba(147, 51, 234, 0.4)" stroke-width="1" />
      <circle cx="12" cy="12" r="4" fill="#a855f7" />
      <text x="24" y="17" font-size="11" font-weight="700" fill="#c084fc">Gemini AI</text>

      <!-- Real-Time -->
      <rect x="105" y="0" width="105" height="24" rx="12" fill="rgba(59, 130, 246, 0.2)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
      <circle cx="117" cy="12" r="4" fill="#3b82f6" />
      <text x="129" y="17" font-size="11" font-weight="700" fill="#60a5fa">WebSockets</text>

      <!-- MERN Stack -->
      <rect x="220" y="0" width="90" height="24" rx="12" fill="rgba(34, 197, 94, 0.2)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1" />
      <circle cx="232" cy="12" r="4" fill="#22c55e" />
      <text x="244" y="17" font-size="11" font-weight="700" fill="#4ade80">MERN Stack</text>

      <!-- Row 2 -->
      <!-- WebRTC Video -->
      <rect x="0" y="30" width="112" height="24" rx="12" fill="rgba(6, 182, 212, 0.2)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
      <circle cx="12" cy="42" r="4" fill="#06b6d4" />
      <text x="24" y="47" font-size="11" font-weight="700" fill="#22d3ee">WebRTC Video</text>

      <!-- Screen Record -->
      <rect x="122" y="30" width="106" height="24" rx="12" fill="rgba(244, 63, 94, 0.2)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1" />
      <circle cx="134" cy="42" r="4" fill="#f43f5e" class="live-dot" />
      <text x="146" y="47" font-size="11" font-weight="700" fill="#fda4af">Screen Record</text>

      <!-- Face ID -->
      <rect x="238" y="30" width="72" height="24" rx="12" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
      <circle cx="250" cy="42" r="4" fill="#10b981" />
      <text x="262" y="47" font-size="11" font-weight="700" fill="#6ee7b7">Face ID</text>
    </g>
  </g>

  <!-- RIGHT SIDE: FUTURISTIC CONSOLE TELEMETRY PANEL -->
  <g transform="translate(565, 45)">
    <!-- Console Box -->
    <rect width="205" height="155" rx="8" fill="#0b0f19" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />
    <rect width="205" height="24" rx="8" fill="#1e293b" opacity="0.3" />
    <!-- Terminal Dot indicators -->
    <circle cx="12" cy="12" r="2.5" fill="#ef4444" />
    <circle cx="20" cy="12" r="2.5" fill="#fbbf24" />
    <circle cx="28" cy="12" r="2.5" fill="#22c55e" />
    <text x="40" y="15" fill="#64748b" font-size="8" font-weight="800" letter-spacing="1">SYSTEM TELEMETRY</text>
    
    <!-- Status lines -->
    <g transform="translate(12, 38)">
      <!-- Line 1: Gateway status -->
      <circle cx="5" cy="5" r="3" fill="#22c55e" class="live-dot" />
      <text x="15" y="8" fill="#cbd5e1" font-size="8.5" font-weight="700">GATEWAY: <tspan fill="#4ade80" font-weight="800">ONLINE</tspan></text>
      
      <!-- Line 2: Face ID scanner -->
      <circle cx="5" cy="21" r="3" fill="#3b82f6" class="live-dot" />
      <text x="15" y="24" fill="#cbd5e1" font-size="8.5" font-weight="700">BIOMETRICS: <tspan fill="#60a5fa" font-weight="800">SECURED</tspan></text>
      
      <!-- Line 3: Rec status -->
      <circle cx="5" cy="37" r="3" fill="#ef4444" class="live-dot" />
      <text x="15" y="40" fill="#cbd5e1" font-size="8.5" font-weight="700">SCREEN REC: <tspan fill="#fca5a5" font-weight="800">RECORDING</tspan></text>

      <!-- Line 4: Threat filter -->
      <circle cx="5" cy="53" r="3" fill="#10b981" />
      <text x="15" y="56" fill="#cbd5e1" font-size="8.5" font-weight="700">FIREWALL: <tspan fill="#34d399" font-weight="800">SHIELDED (SQLi)</tspan></text>
    </g>

    <!-- Gauges & Counters -->
    <g transform="translate(12, 110)">
      <!-- CPU Gauge -->
      <path d="M 0 15 A 12 12 0 0 1 24 15" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 0 15 A 12 12 0 0 1 18 6" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />
      <text x="12" y="26" fill="#94a3b8" font-size="7.5" text-anchor="middle" font-weight="700">CPU 62%</text>

      <!-- RAM Gauge -->
      <g transform="translate(48, 0)">
        <path d="M 0 15 A 12 12 0 0 1 24 15" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 0 15 A 12 12 0 0 1 12 3" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
        <text x="12" y="26" fill="#94a3b8" font-size="7.5" text-anchor="middle" font-weight="700">RAM 48%</text>
      </g>

      <!-- Threats Blocked -->
      <g transform="translate(100, -8)">
        <rect width="80" height="32" rx="4" fill="#1c1917" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1" />
        <text x="40" y="11" fill="#fca5a5" font-size="7" font-weight="800" text-anchor="middle">BLOCKED THREATS</text>
        <text x="40" y="25" fill="#ef4444" font-size="11" font-weight="900" text-anchor="middle">0</text>
      </g>
    </g>
  </g>

  <!-- Bottom Details Compliances info -->
  <text x="230" y="245" fill="#64748b" font-size="9" font-weight="600" letter-spacing="1">🔒 COMPLIANT END-TO-END VETERINARY INTELLIGENCE HUB</text>

  <!-- Glowing pulse indicators on the ECG path to show flow -->
  <circle cx="160" cy="180" r="3" fill="#ef4444" filter="url(#neon-glow)" />
  <circle cx="300" cy="160" r="3" fill="#eab308" filter="url(#neon-glow)" />
  <circle cx="540" cy="180" r="3" fill="#3b82f6" filter="url(#neon-glow)" />
</svg>
